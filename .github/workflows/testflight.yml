# master에 push하면 나날 iOS 빌드를 TestFlight에 올린다(scripts/upload-testflight.sh).
# 빌드 번호는 App Store Connect의 마지막 번호 + 1로 자동으로 정한다.
# 커밋 메시지에 [skip testflight]가 있으면 건너뛴다. Actions 탭에서 손으로 돌릴 수도 있다.
# Secrets: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8(관리자 팀 키 .p8 내용),
#          EXPO_PUBLIC_SUPABASE_URL, EXPO_PUBLIC_SUPABASE_ANON_KEY
name: TestFlight

on:
  push:
    branches: [master]
  workflow_dispatch:

# 빌드 번호를 서버에서 읽어 정하므로 한 번에 하나씩만 올린다.
concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    if: ${{ !contains(github.event.head_commit.message, '[skip testflight]') }}
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install
        working-directory: mobile
        run: npm ci

      - name: Keys
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s\n' "$ASC_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          printf 'EXPO_PUBLIC_SUPABASE_URL=%s\nEXPO_PUBLIC_SUPABASE_ANON_KEY=%s\n' \
            "$EXPO_PUBLIC_SUPABASE_URL" "$EXPO_PUBLIC_SUPABASE_ANON_KEY" > mobile/.env

      - name: Build and upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          BUILD_NUMBER: auto
          # 첫 실행(run_number 1)이 빌드 16이었다. 실행마다 1씩 올라가 처리 중인 빌드와 겹치지 않는다.
          MIN_BUILD_NUMBER: ${{ github.run_number + 15 }}
          TMPDIR: ${{ runner.temp }}
        run: scripts/upload-testflight.sh

      # 실패하면 단계별 로그(prebuild·archive·export·upload)를 받아 볼 수 있게 남긴다.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-logs
          path: ${{ runner.temp }}/nanal-upload/*.log
          if-no-files-found: ignore
